apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
          
      # This links the NodePool directly to the AWS instructions below
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
        
      # Security/hygiene: Forces nodes to recycle after 30 days
      expireAfter: 720h 
      
  # Prevents Karpenter from accidentally buying too many servers
  limits:
    cpu: 1000
    
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  
  # The exact IAM Role created by your Terraform Blueprints
  role: "KarpenterNodeRole-edge-cluster" 
  associatePublicIPAddress: true
  
  amiSelectorTerms:
    - alias: al2023@latest
    
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "edge-cluster"
        
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/edge-cluster: "owned"